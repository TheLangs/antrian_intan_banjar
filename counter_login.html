<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Loket - PT Air Minum Intan Banjar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/custom.css" />
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 selection:bg-blue-200">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden">
      <div class="bg-blue-800 p-8 text-center">
        <img src="assets/images/logo-intan-banjar.png" alt="Logo Intan Banjar" class="w-16 h-16 object-contain mx-auto mb-4" />
        <h2 class="text-2xl font-bold text-white">Sistem Antrean Kasir</h2>
        <p class="text-blue-200 text-sm mt-1">PT Air Minum Intan Banjar (Perseroda)</p>
      </div>

      <div class="p-8">
        <div id="error-msg" class="hidden mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100 font-medium"></div>

        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Pilih Loket</label>
            <select id="sel-loket" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-transparent font-medium">
              <option value="" disabled selected>-- Pilih Loket Kasir --</option>
              <option value="1">Loket 1</option>
              <option value="2">Loket 2</option>
              <option value="3">Loket 3</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Petugas</label>
            <input
              type="text"
              id="inp-nama"
              required
              placeholder="Masukkan nama Anda"
              class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-transparent font-medium" />
          </div>

          <button type="submit" id="btn-submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md mt-4 flex items-center justify-center gap-2">Masuk ke Dashboard</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { supabase } from './assets/js/supabaseClient.js';

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        const errBox = document.getElementById('error-msg');
        const idLoket = document.getElementById('sel-loket').value;
        const nama = document.getElementById('inp-nama').value;

        btn.disabled = true;
        btn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> Memproses...';
        errBox.classList.add('hidden');

        try {
          // Check lock status
          const { data: loket, error: errLoket } = await supabase.from('loket').select('last_seen, session_token').eq('id_loket', idLoket).single();

          if (errLoket) throw errLoket;

          // Validate if someone is actively using it (last_seen < 30s ago)
          if (loket && loket.last_seen) {
            const diffTime = (new Date() - new Date(loket.last_seen)) / 1000;
            const prevSession = localStorage.getItem('ib_session_token');

            if (diffTime < 30 && loket.session_token !== prevSession) {
              throw new Error(`Loket ${idLoket} sedang digunakan oleh petugas lain. Silakan tunggu.`);
            }
          }

          // Create new session
          const newToken = crypto.randomUUID();

          const { error: errUpdate } = await supabase
            .from('loket')
            .update({
              session_token: newToken,
              nama_petugas: nama,
              last_seen: new Date().toISOString(),
              status_aktif: 'aktif',
            })
            .eq('id_loket', idLoket);

          if (errUpdate) throw errUpdate;

          // Save to local storage
          localStorage.setItem('ib_session_token', newToken);
          localStorage.setItem('ib_id_loket', idLoket);
          localStorage.setItem('ib_nama_petugas', nama);

          window.location.href = 'counter.html';
        } catch (err) {
          errBox.textContent = err.message || 'Terjadi kesalahan saat mencoba terhubung.';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = 'Masuk ke Dashboard';
        }
      });
    </script>
  </body>
</html>
