<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - Intan Banjar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/custom.css" />
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 selection:bg-blue-200">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden">
      <div class="bg-slate-800 p-8 text-center border-b-4 border-slate-700">
        <img src="assets/images/logo-intan-banjar.png" alt="Logo Intan Banjar" class="w-16 h-16 object-contain mx-auto mb-4" />
        <h2 class="text-2xl font-bold text-white">Sistem Analitik Admin</h2>
        <p class="text-slate-300 text-sm mt-1">Sistem Manajemen Antrean</p>
      </div>

      <div class="p-8">
        <div id="error-msg" class="hidden mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100 font-medium"></div>

        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
            <input
              type="text"
              id="inp-user"
              required
              placeholder="admin"
              class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-transparent font-medium" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Kata Sandi</label>
            <input
              type="password"
              id="inp-pass"
              required
              placeholder="••••••••"
              class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-transparent font-medium" />
          </div>

          <button type="submit" id="btn-submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md mt-4 flex items-center justify-center gap-2">Masuk</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { supabase } from './assets/js/supabaseClient.js';

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        const errBox = document.getElementById('error-msg');
        const user = document.getElementById('inp-user').value;
        const pass = document.getElementById('inp-pass').value;

        btn.disabled = true;
        btn.innerHTML = 'Memproses...';
        errBox.classList.add('hidden');

        try {
          // Client side auth equivalent logic since no server node app is allowed
          const { data, error } = await supabase.from('admin').select('id_admin, username, nama_lengkap').eq('username', user).eq('password_hash', pass).single();

          if (error || !data) {
            throw new Error('Kredensial tidak valid.');
          }

          localStorage.setItem('ib_admin_id', data.id_admin);
          localStorage.setItem('ib_admin_name', data.nama_lengkap);

          window.location.href = 'admin.html';
        } catch (err) {
          errBox.textContent = err.message || 'Username atau kata sandi salah.';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = 'Masuk';
        }
      });
    </script>
  </body>
</html>
