<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - PT Air Minum Intan Banjar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/custom.css" />
  </head>
  <body class="bg-slate-50 min-h-screen flex flex-col selection:bg-blue-200">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-sm py-4 px-6 flex items-center justify-between z-10 sticky top-0">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center text-slate-800 font-bold text-xl shadow-inner">IB</div>
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">Dashboard Admin & Analitik</h1>
          <p class="text-xs text-slate-300 font-medium tracking-wide">PT Air Minum Intan Banjar</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-sm font-semibold text-slate-300">👋 <span id="admin-name">Admin</span></span>
        <button id="btn-logout" class="bg-slate-700 hover:bg-red-500 text-white font-semibold text-xs px-4 py-2 rounded-lg transition-colors border border-slate-600">Keluar</button>
      </div>
    </header>

    <main class="flex-grow p-8 max-w-7xl mx-auto w-full">
      <!-- Control Bar -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row items-end justify-between gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Pilih Periode Laporan Tanggal</label>
          <div class="flex flex-wrap items-center gap-3">
            <input type="date" id="date-start" class="bg-slate-50 border border-slate-200 text-slate-800 rounded-lg p-2 outline-none font-medium text-sm" />
            <span class="text-slate-400 font-bold">s/d</span>
            <input type="date" id="date-end" class="bg-slate-50 border border-slate-200 text-slate-800 rounded-lg p-2 outline-none font-medium text-sm" />
            <button id="btn-filter" class="bg-blue-800 hover:bg-blue-900 text-white font-bold px-5 py-2.5 rounded-lg shadow-sm">Filter</button>
          </div>
        </div>
        <button id="btn-export" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg shadow-md flex items-center gap-2 transition-transform active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          Export PDF
        </button>
      </div>

      <!-- KPI Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-800 flex justify-between items-center transition-transform hover:-translate-y-0.5">
          <div>
            <p class="text-xs font-bold text-slate-500 uppercase mb-1">Total Antrean</p>
            <h3 class="text-3xl font-black text-slate-800" id="kpi-total">0</h3>
          </div>
          <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500 flex justify-between items-center transition-transform hover:-translate-y-0.5">
          <div>
            <p class="text-xs font-bold text-slate-500 uppercase mb-1">Selesai Dilayani</p>
            <h3 class="text-3xl font-black text-slate-800" id="kpi-selesai">0</h3>
          </div>
          <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500 flex justify-between items-center transition-transform hover:-translate-y-0.5">
          <div>
            <p class="text-xs font-bold text-slate-500 uppercase mb-1">Terlewat / Batal</p>
            <h3 class="text-3xl font-black text-slate-800" id="kpi-terlewat">0</h3>
          </div>
          <div class="w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-amber-500 flex justify-between items-center transition-transform hover:-translate-y-0.5">
          <div>
            <p class="text-xs font-bold text-slate-500 uppercase mb-1">Rerata Wkt. Tunggu</p>
            <h3 class="text-3xl font-black text-slate-800" id="kpi-avg-wait">0m 0s</h3>
          </div>
          <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
        </div>
      </div>

      <!-- Trans Table -->
      <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden relative min-h-[400px]">
        <div id="loader" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center hidden">
          <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-800 rounded-full animate-spin mb-4"></div>
          <p class="text-xs font-semibold text-slate-600">Memuat data...</p>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left whitespace-nowrap">
            <thead>
              <tr class="bg-slate-100/50 text-slate-600 font-bold text-xs uppercase tracking-wider border-b border-slate-100">
                <th class="px-6 py-4">Nomor</th>
                <th class="px-6 py-4">Metode</th>
                <th class="px-6 py-4">Loket</th>
                <th class="px-6 py-4">Kasir</th>
                <th class="px-6 py-4">Waktu Ambil</th>
                <th class="px-6 py-4">D. Tunggu</th>
                <th class="px-6 py-4">D. Layan</th>
                <th class="px-6 py-4">Status</th>
              </tr>
            </thead>
            <tbody id="table-body" class="text-sm font-medium text-slate-700 divide-y divide-slate-100">
              <!-- rows -->
            </tbody>
          </table>
        </div>

        <div id="table-empty" class="hidden py-16 text-center text-slate-500 font-medium tracking-wide">Tidak ada data transaksi pada periode ini.</div>
      </div>
    </main>

    <!-- Libs for PDF Export via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script type="module" src="assets/js/admin.js"></script>
  </body>
</html>
