<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Counter Operator Dashboard - SIMAH</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Extending the snippet CSS explicitly for this page -->
    <script>
      if (window.tailwind) {
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                surface: '#FFFFFF',
                info: '#0284C7',
                'text-muted': '#94A3B8',
                outline: '#727784',
                'error-bg': '#FEF2F2',
                border: '#E2E8F0',
                primary: '#004e9f',
                'on-primary': '#ffffff',
                'success-bg': '#ECFDF5',
                'surface-container': '#ecedf6',
                'text-primary': '#0F172A',
                warning: '#F59E0B',
                'accent-water': '#0284C7',
                background: '#F8FAFC',
                'surface-hover': '#F1F5F9',
                'surface-tint': '#005cba',
                'text-secondary': '#64748B',
                success: '#10B981',
                error: '#EF4444',
                'primary-container': '#0066cc',
                'primary-fixed': '#d7e3ff',
              },
              fontFamily: {
                'body-sm': ["'Inter'", 'sans-serif'],
                'kpi-display': ["'Inter'", 'sans-serif'],
                'headline-sm': ["'Inter'", 'sans-serif'],
                'body-md': ["'Inter'", 'sans-serif'],
                'label-badge': ["'Inter'", 'sans-serif'],
                'headline-md': ["'Inter'", 'sans-serif'],
              },
            },
          },
        };
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
        font-family: 'Inter', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      .fill-icon {
        font-variation-settings:
          'FILL' 1,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      .card-shadow {
        box-shadow:
          0 1px 3px 0 rgba(0, 0, 0, 0.1),
          0 1px 2px 0 rgba(0, 0, 0, 0.06);
      }
      .ambient-shadow {
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>
  <body class="text-text-primary text-[14px] h-screen overflow-hidden flex bg-background">
    <main class="flex-1 flex flex-col h-full relative z-0">
      <header class="bg-surface border-b border-border flex justify-between items-center h-16 px-6 fixed top-0 right-0 z-20 w-full left-0">
        <div class="text-[16px] font-semibold text-text-primary flex items-center gap-3">
          <img src="assets/images/logo-intan-banjar.png" alt="Logo Intan Banjar" class="w-8 h-8 object-contain" />
          Sistem Antrian Intan Banjar
        </div>
        <div class="flex items-center gap-4">
          <div id="conn-status" class="flex items-center gap-2 px-3 py-1 bg-success-bg rounded-full border border-success/20">
            <div id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-success animate-pulse"></div>
            <span class="text-[12px] font-semibold text-success tracking-wide">Online</span>
          </div>
          <button id="btn-logout" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-border hover:bg-error-bg hover:text-error hover:border-error/30 text-text-secondary transition-colors duration-150 shadow-sm">
            <span class="material-symbols-outlined text-[20px]">logout</span>
            <span class="text-[13px] font-semibold">Keluar</span>
          </button>
        </div>
      </header>

      <div class="mt-16 p-6 flex-1 overflow-y-auto overflow-x-hidden">
        <!-- Operator Header Info -->
        <div class="flex items-center justify-between mb-6 bg-surface p-6 rounded-xl card-shadow">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-accent-water/10 flex items-center justify-center text-accent-water">
              <span class="material-symbols-outlined text-2xl fill-icon">support_agent</span>
            </div>
            <div>
              <h2 id="header-info" class="font-semibold text-[20px] text-text-primary">Loket - <span class="text-text-secondary text-[14px] ml-2 font-normal">• Petugas: -</span></h2>
              <p class="text-[13px] text-text-secondary mt-0.5">Terminal Pelayanan</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <button id="btn-refresh" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-border bg-surface-hover hover:bg-slate-200/70 text-text-primary font-semibold text-[13px] transition-colors shadow-sm active:scale-95" title="Segarkan data antrian">
              <span class="material-symbols-outlined text-[18px] text-primary">refresh</span>
              <span>Segarkan Data</span>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Main Action Area -->
          <div class="lg:col-span-8 flex flex-col gap-4">
            <div class="bg-surface rounded-xl card-shadow p-8 flex flex-col items-center justify-center relative overflow-hidden border-t-[5px] border-accent-water min-h-[450px]">
              <div class="absolute -right-24 -top-24 w-64 h-64 bg-accent-water/5 rounded-full blur-3xl"></div>
              <div class="absolute -left-24 -bottom-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>

              <div class="text-center z-10 w-full flex flex-col items-center">
                <span class="text-[13px] font-bold text-accent-water uppercase tracking-widest mb-4 block">Sedang Dilayani</span>

                <div class="flex items-center justify-center gap-4 mb-4 mt-6">
                  <div id="active-nomor" class="text-[120px] font-bold text-text-primary leading-none tracking-tighter tabular-nums transition-all">- - -</div>
                </div>

                <div class="inline-flex items-center gap-2 px-5 py-2.5 bg-surface-hover rounded-xl text-text-secondary text-[14px] font-medium mb-10 border border-border">
                  <span class="material-symbols-outlined text-[18px]">groups</span>
                  Sisa antrian menunggu: <strong id="cnt-menunggu" class="text-text-primary font-bold ml-1">0</strong> <span class="text-text-muted text-[13px]">orang</span>
                </div>

                <!-- Button group when active -->
                <div id="btn-group-active" class="hidden flex-col gap-3 w-full max-w-md mx-auto relative z-10">
                  <div class="grid grid-cols-2 gap-3 w-full">
                    <button
                      id="btn-panggil-ulang"
                      class="bg-surface border border-border text-text-primary hover:bg-surface-hover py-3.5 rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors text-[14px] shadow-sm active:scale-98">
                      <span class="material-symbols-outlined text-[18px]">replay</span> Panggil Ulang
                    </button>
                    <button
                      id="btn-selesai"
                      class="bg-success-bg border border-success/30 hover:bg-success/15 text-success py-3.5 rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors text-[14px] shadow-sm active:scale-98">
                      <span class="material-symbols-outlined text-[18px]">check_circle</span> Selesai
                    </button>
                  </div>
                  <button
                    id="btn-lewati"
                    class="w-full bg-surface border border-border hover:bg-error-bg hover:text-error hover:border-error/30 text-text-secondary py-3.5 rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors text-[14px] shadow-sm active:scale-98">
                    <span class="material-symbols-outlined text-[18px]">skip_next</span> Lewati (Tidak Hadir)
                  </button>
                </div>

                <!-- Button group when NO active ticket -->
                <div id="btn-group-next" class="block w-full max-w-md mx-auto relative z-10">
                  <button
                    id="btn-panggil"
                    class="w-full bg-primary hover:bg-surface-tint text-on-primary font-semibold text-[18px] py-5 rounded-2xl flex items-center justify-center gap-2 transition-colors ambient-shadow hover:-translate-y-0.5 transform duration-200">
                    <span class="material-symbols-outlined text-2xl">campaign</span>
                    Panggil Antrian Berikutnya
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Sidebar Area (Right) -->
          <div class="lg:col-span-4 flex flex-col gap-5 h-[560px]">
            <!-- Antrian Menunggu -->
            <div class="bg-surface rounded-xl card-shadow p-5 flex flex-col h-1/2">
              <div class="flex items-center justify-between mb-3 border-b border-border pb-3">
                <h3 class="font-bold text-[17px] text-text-primary">Antrian Menunggu</h3>
                <span class="bg-surface-container px-3 py-1 rounded-full text-[11px] font-bold tracking-wider text-text-secondary uppercase"><span id="cnt-menunggu-badge">0</span> Total</span>
              </div>
              <div id="list-menunggu" class="flex-grow overflow-y-auto pr-2 space-y-2.5">
                <div class="text-center p-6 text-text-muted text-[13px] font-medium">Tidak ada antrian menunggu.</div>
              </div>
            </div>

            <!-- Antrian Terlewat -->
            <div class="bg-surface rounded-xl card-shadow p-5 flex flex-col h-1/2">
              <div class="flex items-center justify-between mb-3 border-b border-border pb-3">
                <h3 class="font-bold text-[17px] text-text-primary">Antrian Terlewat</h3>
                <span class="bg-surface-container px-3 py-1 rounded-full text-[11px] font-bold tracking-wider text-text-secondary uppercase cursor-help" title="Membutuhkan Tindakan">Action</span>
              </div>
              <div id="list-terlewat" class="flex-grow overflow-y-auto pr-2 space-y-2.5">
                <div class="text-center p-6 text-text-muted text-[13px] font-medium">Tidak ada antrian terlewat.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Overlay Loader -->
    <div id="loader" class="hidden fixed inset-0 z-50 bg-text-primary/40 backdrop-blur-sm flex items-center justify-center">
      <div class="bg-surface px-8 py-6 rounded-2xl ambient-shadow flex flex-col items-center">
        <div class="w-8 h-8 border-4 border-primary-fixed border-t-primary rounded-full animate-spin mb-4"></div>
        <p class="text-[14px] font-semibold text-text-primary mt-2">Memproses...</p>
      </div>
    </div>

    <script type="module" src="assets/js/counter.js?v=4"></script>
  </body>
</html>
