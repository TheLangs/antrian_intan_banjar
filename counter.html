<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Kasir - PT Air Minum Intan Banjar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/custom.css" />
  </head>
  <body class="bg-slate-50 min-h-screen flex flex-col selection:bg-blue-200">
    <header class="bg-white border-b border-slate-200 shadow-sm py-4 px-6 flex items-center justify-between z-10 sticky top-0">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-blue-800 flex items-center justify-center text-white font-bold text-xl shadow-inner">IB</div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">Panel Operasional Kasir</h1>
          <p class="text-xs text-slate-500 font-medium" id="header-info">Loket - | Petugas: -</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span id="conn-status" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span id="conn-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-ping-slow"></span>
          Online
        </span>
        <button id="btn-logout" class="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-semibold text-sm px-4 py-2 rounded-lg transition-colors border border-slate-200 hover:border-red-200">Akhiri Sesi</button>
      </div>
    </header>

    <main class="flex-grow p-6 flex gap-6 max-w-7xl mx-auto w-full relative h-[calc(100vh-80px)]">
      <!-- Main Actions -->
      <div class="w-2/3 flex flex-col">
        <div class="bg-white p-10 rounded-3xl shadow-sm border border-slate-200 flex-grow flex flex-col items-center justify-center relative overflow-hidden">
          <h2 class="text-slate-500 font-semibold tracking-widest uppercase text-sm mb-4">Sedang Dilayani</h2>

          <div class="text-center w-full relative z-10">
            <h1 id="active-nomor" class="text-[120px] font-black text-slate-800 leading-none tracking-tighter mb-10 transition-all">- - -</h1>
          </div>

          <div id="btn-group-active" class="hidden flex gap-4 w-full max-w-lg relative z-10">
            <button id="btn-selesai" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-sm hover:shadow-md transition-all">Selesai</button>
            <button id="btn-lewati" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-2xl shadow-sm hover:shadow-md transition-all">Lewati</button>
            <button id="btn-recall" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-2xl shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2">Panggil Ulang</button>
          </div>

          <div id="btn-group-next" class="w-full max-w-lg relative z-10 block mt-2">
            <button id="btn-panggil" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-5 rounded-2xl shadow-md hover:shadow-lg transition-all text-xl">Panggil Antrean Berikutnya</button>
          </div>
        </div>

        <div class="mt-6 flex justify-between items-center px-4">
          <p class="text-sm text-slate-500 font-medium">Sisa antrean menunggu: <strong id="cnt-menunggu" class="text-slate-700 text-base">0</strong> orang</p>
          <button id="btn-refresh" class="text-sm text-blue-600 hover:text-blue-800 font-semibold underline">Segarkan Data</button>
        </div>
      </div>

      <!-- Sidebar / Terlewat -->
      <div class="w-1/3 bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col overflow-hidden">
        <div class="bg-slate-50 border-b border-slate-200 p-5">
          <h3 class="font-bold text-slate-700 text-base">Daftar Antrean Terlewat</h3>
          <p class="text-xs text-slate-500">Antrean yang dilewati hari ini</p>
        </div>

        <div id="list-terlewat" class="flex-grow overflow-y-auto p-4 space-y-3 bg-slate-50">
          <!-- list dynamically generated -->
          <div class="text-center p-6 text-slate-400 text-sm font-medium">Tidak ada antrean terlewat.</div>
        </div>
      </div>
    </main>

    <!-- Overlay Loader -->
    <div id="loader" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center">
      <div class="bg-white px-8 py-6 rounded-2xl shadow-xl flex flex-col items-center">
        <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-800 rounded-full animate-spin mb-4"></div>
        <p class="text-sm font-semibold text-slate-700 mt-2">Memproses...</p>
      </div>
    </div>

    <script type="module" src="assets/js/counter.js"></script>
  </body>
</html>
